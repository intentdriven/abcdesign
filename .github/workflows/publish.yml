name: publish

# Publishes abcdesign.app: the brief-session page abcd writes with
# `abcd session page`, built from the latest abcd release, checksum- and
# attestation-verified, then deployed to this repository's GitHub Pages.
# The page's source lives in intentdriven/abcd; this repository holds only
# this workflow. It uses no secret beyond the run's own token.
#
# A release that does not yet carry `abcd session page` publishes nothing:
# the build says so and the deploy job is skipped.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.page.outputs.ready }}
    steps:
      - name: Download the latest abcd release and its checksums
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo intentdriven/abcd --json tagName --jq .tagName)
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected release tag: $tag"; exit 1 ;;
          esac
          gh release download "$tag" --repo intentdriven/abcd \
            --pattern 'abcd-linux-amd64' --pattern 'checksums.txt' --dir "$RUNNER_TEMP"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify abcd against its release manifest and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          grep ' abcd-linux-amd64$' checksums.txt | sha256sum -c -
          gh attestation verify abcd-linux-amd64 --repo intentdriven/abcd \
            --signer-workflow intentdriven/abcd/.github/workflows/release.yml
          install -m 0755 abcd-linux-amd64 "${RUNNER_TEMP}/abcd"

      - name: Render the page
        id: page
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! "${RUNNER_TEMP}/abcd" session page --help >/dev/null 2>&1; then
            echo "::notice::abcd $TAG does not carry abcd session page yet, so nothing is published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "${RUNNER_TEMP}/abcd" session page --out "${RUNNER_TEMP}/site"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the page
        if: steps.page.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
